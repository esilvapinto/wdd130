<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fale Conosco | River Rush Adventures</title>

    <meta name="description"
      content="Entre em contato com a River Rush Adventures. Tire suas dúvidas sobre reservas, envie sugestões ou fale diretamente com nossa equipe de suporte.">

    <meta name="author" content="Elias Silva Pinto">

    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>

    <header>

        <img src="imagens/z-raftingcompas.png" alt="Logotipo River Rush Adventures">

        <nav>
            <a href="index.html">Página Inicial</a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="passeios.html">Passeios</a>
            <a href="contato.html">Fale Conosco</a>
        </nav>

    </header>

    <main>

        <!-- Informações e Cabeçalho de Contato -->
        <section class="contact-hero">
            <h1>River Rush Adventures - Companhia de Rafting em Corredeiras</h1>
            <p>123 Rua Principal do Rio<br>
                Foz do Iguaçu, Paraná<br>
                +55 45 99999-9999<br>
                info@correiras.com</p>
        </section>

        <!-- Grid com Mapa e Formulário -->
        <section class="contact-grid">

            <!-- Mapa do Google incorporado -->
            <div class="map-box">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3725.298285511874!2d-54.58557!3d-25.54778!2m3!1f0!2f0!3f0!3m2!1f1024!2f768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMjXCszMnMjguMCJTIDM0wrAzNSdDAzguMCJX!5e0!3m2!1spt-BR!2sbr!4v1620000000000!5m2!1spt-BR!2sbr"
                  allowfullscreen="" loading="lazy"></iframe>
            </div>

            <!-- Formulário de Contato -->
            <div class="form-box">
                <form action="#" method="post" class="contact-form">

                    <div>
                        <label for="name">Nome</label>
                        <input type="text" id="name" name="name" placeholder="Digite aqui" required>
                    </div>

                    <div>
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="Digite aqui"
                          required>
                    </div>

                    <fieldset class="radio-group">
                        <legend>Propósito da Mensagem</legend>
                        <div class="radio-options">
                            <label for="consulta">
                                <input type="radio" id="consulta" name="purpose"
                                  value="Dúvida Geral" checked> Dúvida Geral
                            </label>
                            <label for="reserva">
                                <input type="radio" id="reserva" name="purpose"
                                  value="Pergunta sobre Reserva"> Pergunta sobre Reserva
                            </label>
                            <label for="sugestao">
                                <input type="radio" id="sugestao" name="purpose" value="Sugestão">
                                Sugestão
                            </label>
                        </div>
                    </fieldset>

                    <div>
                        <label for="message">Mensagem</label>
                        <textarea id="message" name="message" rows="4" placeholder="Digite aqui"
                          required></textarea>
                    </div>

                    <div>
                        <label class="checkbox-label" for="newsletter">
                            <input type="checkbox" name="newsletter" id="newsletter"> Por favor, me
                            inscreva na newsletter mensal
                        </label>
                    </div>

                    <button type="submit" class="submit-btn">Entrar em Contato!</button>

                </form>
            </div>

        </section>

        <!-- Seção de Funcionários (Equipe) -->
        <section class="team-section">
            <h2>Estamos Aqui para Serví-lo</h2>
            <div class="team-grid">
                <figure>
                    <img src="imagens/rafting47_600.jpg" alt="Perfil do Funcionário Carlos">
                    <figcaption>Carlos - Guia Chefe</figcaption>
                </figure>
                <figure>
                    <img src="imagens/rafting53_600.jpg" alt="Perfil do Funcionário Ana">
                    <figcaption>Ana - Instrutora</figcaption>
                </figure>
                <figure>
                    <img src="imagens/rafting56_600.jpg" alt="Perfil do Funcionário Marcos">
                    <figcaption>Marcos - Reservas</figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer>

        <p>© 2026 River Rush Adventures | Elias Silva Pinto</p>

        <nav class="redes-sociais">
            <a href="https://facebook.com">
                <img src="imagens/facebook-square.jpg" alt="Facebook">
            </a>
            <a href="https://instagram.com">
                <img src="imagens/instagram-square.jpg" alt="Instagram">
            </a>
            <a href="https://linkedin.com">
                <img src="imagens/linkedin-square.jpg" alt="LinkedIn">
            </a>
        </nav>

    </footer>

</body>

</html>
